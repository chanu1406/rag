[pytest]
# Pytest configuration for Local Brain RAG
# Per AGENTCONTEXT.md: Clear test execution and reporting

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for pipeline
    slow: Tests that take significant time
    gpu: Tests requiring CUDA/GPU
    ollama: Tests requiring Ollama service

# Coverage (optional)
# Run with: pytest --cov=src --cov-report=html

# Logging
log_cli = false
log_cli_level = INFO
