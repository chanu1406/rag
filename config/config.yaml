system:
  version: "1.0.0"
  log_level: "INFO"
  data_dir: "./data"
  persist_dir: "./data/chroma_db"

llm:
  provider: "ollama"
  model: "llama3"       # Must be pulled via `ollama pull llama3`
  base_url: "http://localhost:11434"
  context_window: 4096  # Strict limit to prevent OOM
  temperature: 0.0      # Deterministic output

embedding:
  provider: "huggingface"
  model_name: "sentence-transformers/all-MiniLM-L6-v2" # Small, fast, accurate enough
  device: "cuda"        # Force CUDA for embeddings

retrieval:
  chunk_size: 500       # Smaller chunks = better precision
  chunk_overlap: 50
  k_retrieved: 20       # Fetch more for re-ranking
  k_final: 5            # Final context to LLM
  use_reranker: true    # Enable FlashRank

ingestion:
  valid_extensions:
    - ".pdf"
    - ".txt"
    - ".md"
    - ".docx"
  ignore_patterns:
    - "__pycache__"
    - ".git"
